<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Girl Day - Hapsari</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
    
    <style>
        body {
            /* Soft romantic gradient background */
            background: linear-gradient(135deg, #fdfbfb 0%, #ffefea 50%, #fbeff2 100%);
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
        }

        .font-cursive {
            font-family: 'Dancing Script', cursive;
        }

        /* Pure CSS Heart */
        .heart {
            position: relative;
            width: 100px;
            height: 90px;
            animation: heartbeat 1.2s infinite cubic-bezier(0.215, 0.61, 0.355, 1);
            cursor: pointer;
            transition: all 0.5s ease-out;
        }

        .heart::before,
        .heart::after {
            position: absolute;
            content: "";
            left: 50px;
            top: 0;
            width: 50px;
            height: 80px;
            background: #ff4d6d;
            border-radius: 50px 50px 0 0;
            transform: rotate(-45deg);
            transform-origin: 0 100%;
            box-shadow: 0 0 20px rgba(255, 77, 109, 0.4);
            transition: background 0.3s ease;
        }

        .heart::after {
            left: 0;
            transform: rotate(45deg);
            transform-origin: 100% 100%;
        }

        .heart:hover::before,
        .heart:hover::after {
            background: #ff3355;
            box-shadow: 0 0 30px rgba(255, 51, 85, 0.6);
        }

        /* Heartbeat Animation */
        @keyframes heartbeat {
            0% { transform: scale(1); }
            15% { transform: scale(1.15); }
            30% { transform: scale(1); }
            45% { transform: scale(1.15); }
            60% { transform: scale(1); }
            100% { transform: scale(1); }
        }

        /* Float animation for decorative elements */
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); opacity: 0; }
            50% { opacity: 0.5; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }

        .sparkle {
            position: absolute;
            width: 8px;
            height: 8px;
            background: rgba(255, 77, 109, 0.3);
            border-radius: 50%;
            pointer-events: none;
            animation: float 5s infinite linear;
        }

        /* Smooth transitions for fade in/out */
        .fade-transition {
            transition: opacity 1s ease-out, transform 1s ease-out;
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center relative">

    <!-- Decorative background particles -->
    <div id="particles-container" class="absolute inset-0 overflow-hidden pointer-events-none"></div>

    <!-- Initial Heart Container -->
    <div id="heart-container" class="z-10 flex flex-col items-center justify-center fade-transition opacity-100 scale-100">
        <div class="heart" id="the-heart"></div>
        <p class="mt-8 text-pink-400/80 text-sm tracking-widest font-light uppercase animate-pulse">
            Sentuh hatinya
        </p>
    </div>

    <!-- Hidden Message Container -->
    <div id="message-container" class="hidden absolute inset-0 z-20 flex items-center justify-center p-6 fade-transition opacity-0 translate-y-10">
        <div class="text-center bg-white/40 backdrop-blur-sm p-10 md:p-16 rounded-3xl shadow-[0_8px_32px_0_rgba(255,182,193,0.3)] border border-white/50 max-w-2xl w-full">
            
            <p class="font-cursive text-3xl md:text-4xl text-[#ff4d6d] mb-2 leading-relaxed">
                happy girl day
            </p>
            
            <h1 class="font-cursive text-5xl md:text-7xl font-bold text-[#d62828] mb-6 drop-shadow-sm">
                Sayangku Hapsari
            </h1>
            
            <div class="w-24 h-px bg-gradient-to-r from-transparent via-[#ff4d6d] to-transparent mx-auto mb-6"></div>
            
            <p class="text-gray-700 text-lg md:text-xl italic font-light tracking-wide leading-relaxed">
                "untuk perempuanku satu-satunya semesta dalam hidupku ❤️✨"
            </p>

        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const heartContainer = document.getElementById('heart-container');
            const messageContainer = document.getElementById('message-container');
            const particlesContainer = document.getElementById('particles-container');

            // Generate floating sparkles in the background
            for(let i = 0; i < 20; i++) {
                const sparkle = document.createElement('div');
                sparkle.classList.add('sparkle');
                sparkle.style.left = `${Math.random() * 100}vw`;
                sparkle.style.animationDuration = `${Math.random() * 4 + 3}s`;
                sparkle.style.animationDelay = `${Math.random() * 5}s`;
                particlesContainer.appendChild(sparkle);
            }

            // Handle Heart Click
            heartContainer.addEventListener('click', () => {
                // 1. Fade out and shrink the heart
                heartContainer.classList.remove('opacity-100', 'scale-100');
                heartContainer.classList.add('opacity-0', 'scale-50');

                // 2. Wait for the heart to disappear, then show the message
                setTimeout(() => {
                    heartContainer.classList.add('hidden');
                    
                    // Display block for message but keep it transparent
                    messageContainer.classList.remove('hidden');
                    
                    // Force a browser reflow so the transition triggers
                    void messageContainer.offsetWidth;
                    
                    // 3. Fade in and slide up the message
                    messageContainer.classList.remove('opacity-0', 'translate-y-10');
                    messageContainer.classList.add('opacity-100', 'translate-y-0');
                    
                }, 800); // Matches the CSS transition duration
            });
        });
    </script>
</body>
</html>
